name: Android test APK

# Produces one installable, size-optimized arm64 APK for manual testing.
#
# The protected release pipeline lives in android.yml and is untouched. This
# workflow never uses the production signing material: it mints a throwaway key
# that exists only for the lifetime of the runner, so the APK it produces is
# deliberately NOT interchangeable with an official build and cannot upgrade
# over one.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 30.0.14904198
      HAS_TEST_SIGNING_KEY: ${{ secrets.TEST_APK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK inputs
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Linux desktop dependencies
        # The APK itself targets aarch64-linux-android and needs none of these,
        # but the host-side clippy and unit-test run below builds the desktop
        # Tauri stack, which links against GTK and WebKit.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Verify frontend behavior
        working-directory: app
        run: npm test -- --run

      - name: Verify native library
        working-directory: app/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --lib --all-targets -- -D warnings
          cargo test --lib

      - name: Reproduce Android project inputs
        working-directory: app
        run: |
          npm run tauri android init
          node scripts/apply-android-overrides.cjs

      - name: Use the persistent test signing key
        # A key that stays the same across runs lets Android update the app in
        # place. These secrets are specific to this test workflow and are not the
        # production signing material that android.yml protects.
        if: env.HAS_TEST_SIGNING_KEY == 'true'
        working-directory: app
        shell: bash
        env:
          TEST_APK_KEYSTORE_BASE64: ${{ secrets.TEST_APK_KEYSTORE_BASE64 }}
          TEST_APK_KEYSTORE_PASSWORD: ${{ secrets.TEST_APK_KEYSTORE_PASSWORD }}
          TEST_APK_KEY_ALIAS: ${{ secrets.TEST_APK_KEY_ALIAS }}
        run: |
          set +x
          # Secrets pasted from a Windows shell arrive with a trailing CRLF. GNU
          # base64 rejects the carriage return outright, and a password with one
          # appended would silently be the wrong password.
          strip() { printf '%s' "$1" | tr -d '\r\n'; }
          alias="$(strip "$TEST_APK_KEY_ALIAS")"
          password="$(strip "$TEST_APK_KEYSTORE_PASSWORD")"
          test -n "$alias"
          test -n "$password"
          blob="$(printf '%s' "$TEST_APK_KEYSTORE_BASE64" | tr -d '\r\n ')"
          # Diagnostics that reveal nothing: length, character class, and the
          # decoded file's format byte (0x30 = PKCS12, 0xfe = JKS).
          echo "keystore secret: ${#blob} characters after stripping line endings"
          if ! printf '%s' "$blob" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "::error::TEST_APK_KEYSTORE_BASE64 contains characters outside the base64 alphabet; re-set it with: gh secret set TEST_APK_KEYSTORE_BASE64 --body ([Convert]::ToBase64String([IO.File]::ReadAllBytes('path\to\keystore')))"
            exit 1
          fi
          printf '%s' "$blob" | base64 --decode > "$RUNNER_TEMP/test-signing.jks"
          test -s "$RUNNER_TEMP/test-signing.jks"
          echo "decoded keystore: $(wc -c < "$RUNNER_TEMP/test-signing.jks") bytes, format byte 0x$(head -c1 "$RUNNER_TEMP/test-signing.jks" | od -An -tx1 | tr -d ' ')"
          printf 'keyAlias=%s\nkeyPassword=%s\nstorePassword=%s\nstoreFile=%s\n' \
            "$alias" "$password" "$password" \
            "$RUNNER_TEMP/test-signing.jks" \
            > src-tauri/gen/android/app/keystore.properties

      - name: Mint a throwaway signing key
        # Without a persistent key each build is signed differently, so every
        # install requires uninstalling the previous one first.
        if: env.HAS_TEST_SIGNING_KEY != 'true'
        working-directory: app
        shell: bash
        run: |
          set +x
          password="$(openssl rand -base64 24)"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/test-signing.jks" \
            -alias testkey -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$password" -keypass "$password" \
            -dname 'CN=Telegram Drive Test Build, O=Unofficial, C=US'
          printf 'keyAlias=testkey\nkeyPassword=%s\nstorePassword=%s\nstoreFile=%s\n' \
            "$password" "$password" "$RUNNER_TEMP/test-signing.jks" \
            > src-tauri/gen/android/app/keystore.properties

      - name: Build arm64 APK
        working-directory: app
        run: npm run tauri android build -- --target aarch64 --apk true --aab false

      - name: Verify JNI methods survived R8
        # The release build enables R8, which can strip the JNI entry points the
        # Rust side calls into. Without this the APK builds and then fails at
        # runtime.
        working-directory: app
        shell: bash
        run: |
          seeds="$(find src-tauri/gen/android/app/build/outputs/mapping -name seeds.txt -print -quit)"
          test -n "$seeds"
          npm run android:jni:check -- --generated --r8-seeds "$seeds"

      - name: Locate the built APK
        id: locate
        shell: bash
        run: |
          apk="$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          unzip -l "$apk" | grep -E 'lib/.*\.so$'

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telegram-drive-arm64-test-apk
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

name: Android debug APK

# Produces a single installable arm64 debug APK for manual testing.
# The protected release pipeline lives in android.yml and is untouched: this
# workflow never builds a release variant, so it never reaches the signing gate
# and cannot weaken it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 30.0.14904198
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK inputs
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Verify frontend behavior
        working-directory: app
        run: npm test -- --run

      - name: Verify native library
        working-directory: app/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --lib --all-targets -- -D warnings
          cargo test --lib

      - name: Reproduce Android project inputs
        working-directory: app
        run: |
          npm run tauri android init
          node scripts/apply-android-overrides.cjs

      - name: Build arm64 debug APK
        working-directory: app
        run: npm run tauri android build -- --target aarch64 --apk --debug

      - name: Locate the built APK
        id: locate
        shell: bash
        run: |
          apk="$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' -print -quit)"
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telegram-drive-arm64-debug-apk
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
